   <div class="muted" style="margin-top:8px;cursor:pointer" onclick="lg.step='phone';render()">‹ החלף מספר</div></div>`;
 }
 return `<div class="login"><div class="logo">${ICONS.logo}</div><h2>Call AI</h2><p>מודיעין שיחות מכירה</p>
  <input class="field" id="lg-phone" placeholder="מספר טלפון" inputmode="tel" style="max-width:320px">
  <button class="primary" style="max-width:320px" onclick="startLogin()">כניסה</button>
  <div class="muted" id="lg-msg" style="margin-top:14px"></div></div>`;
}
async function startLogin(){
 const p=(document.getElementById('lg-phone').value||'').replace(/\D/g,'');
 if(p.length<9){toast('הזן מספר תקין');return;}
 lg.phone=p; msg('בודק הרשאה…');
 try{
  const ap=await fetch(api('/is_approved?phone='+p)); const aj=await ap.json();
  if(!aj.approved){ msg('המספר אינו מאושר. פנה למנהל כדי לקבל גישה.'); return; }
  const r=await fetch(vapi('/start_call_verification'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:p})});
  const j=await r.json();
  if(j.bot_number){ lg.bot=j.bot_number; lg.nonce=j.nonce; lg.step='verify'; render(); }
  else msg('שגיאה בהתחלת האימות. נסה שוב.');
 }catch(e){ demoLogin(p); }
}
async function checkVerify(){
 msg('בודק אם זוהתה שיחה…');
 try{
  const r=await fetch(vapi('/check_call_verification'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:lg.phone,nonce:lg.nonce})});
  const j=await r.json();
  if(j.status==='verified'&&(j.jwt||j.token)){ finishLogin(lg.phone, j.jwt||j.token); }
  else msg('עדיין לא זוהתה שיחה מהמספר שלך. חייג ונסה שוב.');
 }catch(e){ msg('אין חיבור לשרת האימות.'); }
}
function demoLogin(p){ toast('מצב תצוגה (ללא שרת)'); finishLogin(p, ''); }
async function finishLogin(p, token){
 state.phone=p; localStorage.setItem('callai_phone',p);
 if(token) localStorage.setItem('callai_token',token);
 try{const r=await fetch(api('/role?phone='+p));if(r.ok){const j=await r.json();state.role=j.isManager?'manager':'agent';}}catch(e){}
 localStorage.setItem('callai_role',state.role); state.tab=state.role==='manager'?'command':'clients';
 lg.step='phone'; await loadResults(); render();
}
function render(){const app=document.getElementById('app');
 if(!loggedIn()){app.innerHTML=loginScreen();return;}
 const tabs=state.role==='manager'?MGR_TABS:AGENT_TABS;
 const active=tabs.some(t=>t[0]===state.tab)?state.tab:tabs[0][0];
 const body=(R[state.tab]||R[tabs[0][0]])();
 const tb=`<div class="tabbar">${tabs.map(t=>`<div class="tab ${t[0]===active?'on':''}" onclick="go('${t[0]}')"><span class="ico">${ICONS[t[0]]}</span>${t[1]}</div>`).join('')}</div>`;
 const fab=state.role==='agent'?`<a class="fab" href="tel:${BOT_NUMBER.replace(/\D/g,'')}" aria-label="חייג לבוט">📞</a>`:'';
 app.innerHTML=`<div class="rolebar" onclick="switchRole()">תצוגה: ${state.role==='manager'?'מנהל':'סוכן'} ⇄</div><div class="screen">${body}</div>${tb}${fab}${assignOverlay()}`;
}
function appBack(){
 if(state.assignId){state.assignId=null;return;}
 if(state.tab==='report'){state.showCrit=false;state.tab=state.client?'thread':'clients';return;}
 if(state.tab==='thread'){state.tab=state.from||'clients';return;}
 if(state.tab==='ingest'){state.tab='clients';return;}
 if(state.tab==='rep'){state.tab='command';return;}
}
window.addEventListener('popstate',function(){appBack();render();history.pushState({},'');});
(async function(){if(loggedIn())await loadResults();render();history.pushState({},'');})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
